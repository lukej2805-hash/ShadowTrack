<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowTrack</title>
<style>
:root{--bg:#fff;--fg:#14161a;--muted:#667085;--card:#f4f5f7;--line:#e2e4e9;--accent:#4f46e5;--ok:#15803d;--warn:#b45309;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed;--muted:#9aa0aa;--card:#181b21;--line:#2a2e36;--accent:#818cf8;--ok:#4ade80;--warn:#fbbf24;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--muted);margin:0 0 20px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 220px;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
input.region{flex:0 0 80px;text-transform:uppercase}
button{padding:12px 20px;font-size:16px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
section{margin-top:28px}
h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.list{display:grid;gap:8px}
a.row,.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none}
a.row:hover{border-color:var(--accent)}
.row .url{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.msg{padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px}
.kv div:nth-child(odd){color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin-top:32px}
</style>
</head>
<body>
<main>
  <h1>ShadowTrack</h1>
  <p class="sub">Check where a username, email or phone number shows up online.</p>
  <form id="form">
    <input id="q" placeholder="Username, email or phone" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <input id="region" class="region" value="GB" maxlength="2" title="Default country for phone numbers" aria-label="Region">
    <button id="go" type="submit">Search</button>
  </form>
  <p class="hint">Region is only used for phone numbers without a + prefix. Searching can take 10–30 seconds.</p>
  <div id="out"></div>
  <p class="note">For checking your own footprint or consented research only. Don't use it to harass, stalk or dox anyone.</p>
</main>
<script>
const $ = s => document.querySelector(s);
const out = $("#out");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : "#"; }
function linkRow(name, url) {
  const a = el("a", "row");
  a.href = safeUrl(url); a.target = "_blank"; a.rel = "noopener noreferrer";
  a.append(el("strong", "", name), el("span", "url", url));
  return a;
}
function section(title, cls, items, render) {
  if (!items.length) return null;
  const s = el("section");
  const h = el("h2", cls, title);
  h.append(el("span", "count", String(items.length)));
  const list = el("div", "list");
  items.forEach(i => list.append(render(i)));
  s.append(h, list);
  return s;
}
function usernameSections(results, manual, heading) {
  const frag = document.createDocumentFragment();
  if (heading) frag.append(el("h2", "", heading));
  const found = results.filter(r => r.status === "found");
  const unsure = results.filter(r => ["uncertain", "unverifiable"].includes(r.status));
  const errs = results.filter(r => r.status === "error");
  const r = x => linkRow(x.site, x.url);
  [section("Found", "ok", found, r),
   section("Couldn't verify automatically", "warn", unsure, r),
   section("Check manually (these block bots)", "", manual.map(m => ({site: m.site, url: m.url})), r),
   section("Errors", "err", errs, x => { const d = el("div", "row"); d.append(el("strong", "", x.site), el("span", "url", "blocked or unreachable")); return d; })
  ].filter(Boolean).forEach(s => frag.append(s));
  if (!found.length) frag.prepend(el("div", "msg", "No public accounts confirmed. Try the unverified and manual links below."));
  return frag;
}
function kv(obj) {
  const g = el("div", "kv");
  Object.entries(obj).forEach(([k, v]) => {
    g.append(el("div", "", k), el("div", "", Array.isArray(v) ? v.join(", ") || "none" : String(v)));
  });
  return g;
}
function render(res) {
  out.replaceChildren();
  out.append(el("section", "", "Detected: " + res.type));
  if (res.type === "username") {
    out.append(usernameSections(res.data, res.manual));
  } else if (res.type === "email") {
    const d = res.data, s = el("section");
    s.append(el("h2", "", "Email"));
    if (d.gravatar) s.append(linkRow("Gravatar", d.gravatar)); else s.append(el("div", "msg", "No Gravatar profile found."));
    s.append(el("div", "hint", d.breaches === null ? "Breach check skipped (set HIBP_API_KEY to enable)."
      : "Breaches: " + (d.breaches.join(", ") || "none found")));
    out.append(s);
    out.append(usernameSections(d.username_results, res.manual,
      "Possible accounts for “" + d.username_guess + "” (may be a different person)"));
  } else {
    const s = el("section");
    s.append(el("h2", "", "Phone"));
    if (res.data.error) s.append(el("div", "msg err", res.data.error));
    else {
      s.append(kv(res.data));
      s.append(el("p", "hint", "Phone numbers can only be validated and described here, not matched to accounts."));
    }
    out.append(s);
  }
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go");
  btn.disabled = true; btn.textContent = "Searching…";
  out.replaceChildren(el("div", "msg", "Checking sites, please wait…"));
  try {
    const r = await fetch("/api/search", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: $("#q").value, region: $("#region").value})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Something went wrong");
    render(j);
  } catch (err) {
    out.replaceChildren(el("div", "msg err", err.message));
  } finally {
    btn.disabled = false; btn.textContent = "Search";
  }
});
</script>
</body>
</html>
